[Global]
Name = irc.mars-hotel.local
Info = Mars Hotel Revival local IRC
Network = MarsHotelRevival
AdminInfo1 = Mars Hotel Revival
AdminInfo2 = Private local service
AdminEMail = unavailable@mars-hotel.local
Listen = 0.0.0.0
Ports = 6667
MotdFile = /opt/mars-irc/motd.txt
HelpFile = /opt/mars-irc/help.txt
PidFile = /run/mars-irc/ngircd.pid
ServerUID = marsirc
ServerGID = marsirc

[Limits]
MaxConnections = 64
MaxConnectionsIP = 16
MaxJoins = 12
MaxNickLength = 12
MaxListSize = 64
PingTimeout = 120
PongTimeout = 20

[Options]
AllowRemoteOper = no
CloakHost = local.mars-hotel
CloakUserToNick = yes
ConnectIPv4 = yes
ConnectIPv6 = no
DNS = no
Ident = no
MorePrivacy = yes
PAM = no
IncludeDir = /etc/ngircd/conf.d

[SSL]
CertFile = /run/secrets/irc.crt
KeyFile = /run/secrets/irc.key
DHFile = /opt/mars-irc/dhparams.pem
CipherList = SECURE128:-VERS-SSL3.0
Ports = 6697

[Channel]
Name = #lobby
Topic = Mars Hotel Revival lobby - local and private
Modes = +ntP

[Channel]
Name = #retro
Topic = Retro computing, BBS history, and old hardware
Modes = +ntP
